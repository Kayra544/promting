<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMPTING / FIELD NOTES</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: #1f2937;
            --text-color: #f3f4f6;
            --subtext: #9ca3af;
            --accent: #8b5cf6;
            --border: #374151;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
        }
        .logo {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 20px;
            background: rgba(139, 92, 246, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .nav-section {
            font-size: 13px;
            font-weight: bold;
            color: #60a5fa;
            margin-top: 15px;
            margin-bottom: 6px;
        }
        .nav-item {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--subtext);
            margin-bottom: 3px;
            font-size: 12px;
            transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background-color: rgba(139, 92, 246, 0.2);
            color: var(--text-color);
        }
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .chapter-tag {
            font-size: 12px;
            color: var(--subtext);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .code-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        .code-box {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .code-box.bad { border-left: 4px solid #ef4444; }
        .code-box.good { border-left: 4px solid #10b981; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">PROMPTING / FIELD NOTES</div>
    
    <div class="nav-section">01. Introduction</div>
    <div class="nav-item active" onclick="showContent(0)">Introduction to Prompt Engineering</div>
    
    <div class="nav-section">02. Understanding LLMs</div>
    <div class="nav-item" onclick="showContent(1)">How LLMs Work</div>
    <div class="nav-item" onclick="showContent(2)">Tokens & Sequences</div>
    <div class="nav-item" onclick="showContent(3)">Context Window & Limitations</div>
    
    <div class="nav-section">03. Chat & Feedback</div>
    <div class="nav-item" onclick="showContent(4)">Chat Models & Alignment (RLHF)</div>
    
    <div class="nav-section">04. LLM Applications</div>
    <div class="nav-item" onclick="showContent(5)">Designing Applications</div>
    
    <div class="nav-section">05. Context & RAG</div>
    <div class="nav-item" onclick="showContent(6)">Context, RAG & Workbook</div>
</div>

<div class="main-content">
    <div id="content-display"></div>
</div>

<script>
    const contents = [
        {
            tag: "Introduction Notes",
            title: "Introduction to Prompt Engineering",
            desc: "A language model produces a continuation of the information it receives. Prompt engineering is the practice of making that continuation useful, relevant, and reliable.",
            subtitle: "Core Concept & Structure",
            subdesc: "Going beyond clever phrasing to master context retrieval, conversation state, output constraints, and validation.",
            bad: "Vague prompt:\nExplain transformers.",
            good: "Designed prompt:\nExplain the Transformer architecture to 1st-year CS students with a comparative table."
        },
        {
            tag: "Understanding LLMs",
            title: "How Language Models Work",
            desc: "To use a language model well, understand what it actually processes: tokens, probability distributions, and context windows.",
            subtitle: "The Generation Loop",
            subdesc: "Input Text ➔ Tokenization ➔ Transformer Layers (Self-Attention) ➔ Probability Distribution ➔ Next Token Sampling.",
            bad: "Vague prompt:\nWrite a story.",
            good: "Designed prompt:\nWrite a 3-paragraph sci-fi story about Mars communications. Tone: suspenseful."
        },
        {
            tag: "Tokens & Sequences",
            title: "Tokens and Sequences",
            desc: "Models do not see words the way humans do; they break text down into tokens and predict the next token autoregressively.",
            subtitle: "Tokenization Impact",
            subdesc: "Managing token counts prevents hitting context window limits and controls API execution latency and costs.",
            bad: "Vague prompt:\nSummarize this text.",
            good: "Designed prompt:\nSummarize the core arguments into exactly 5 bullet points under 150 tokens."
        },
        {
            tag: "Context Window",
            title: "The Context Window Limit",
            desc: "Every model has a strict memory window representing the maximum tokens it can hold during a single request.",
            subtitle: "Managing Window Capacity",
            subdesc: "When inputs exceed capacity, earlier parts of the context are truncated or forgotten by the network.",
            bad: "Vague prompt:\nRemember everything.",
            good: "Designed prompt:\nReference strictly the text block provided below to answer the inquiry."
        },
        {
            tag: "Chat & Feedback",
            title: "Chat Models, Human Feedback & Tools",
            desc: "Modern LLMs are fine-tuned via RLHF (Reinforcement Learning from Human Feedback) to act as safe conversational assistants.",
            subtitle: "Safety & Alignment",
            subdesc: "Utilizing system prompts to enforce safe boundaries, structured JSON outputs, and multi-turn alignment.",
            bad: "Vague prompt:\nBe a helpful assistant.",
            good: "Designed prompt:\nAct as a strict code reviewer. Evaluate the JavaScript snippet for security flaws."
        },
        {
            tag: "LLM Applications",
            title: "Designing Applications with Language Models",
            desc: "Moving from playground chats to robust software engineering requires strict system instructions and API orchestration.",
            subtitle: "System Prompts & Guardrails",
            subdesc: "Enforcing schemas ensures downstream software can parse model responses reliably without breaking.",
            bad: "Vague prompt:\nGet data from text.",
            good: "Designed prompt:\nExtract user names and IDs from text below. Output strictly in JSON format."
        },
        {
            tag: "Context & RAG",
            title: "Context, Retrieval-Augmented Generation & Lab",
            desc: "Overcoming model knowledge cutoffs by injecting live reference data directly into prompts via vector search.",
            subtitle: "Grounded Knowledge Retrieval",
            subdesc: "RAG mitigates hallucinations by restricting answers strictly to retrieved source documents.",
            bad: "Vague prompt:\nWhat is our refund policy?",
            good: "Designed prompt:\nUsing ONLY the policy excerpt attached below, state eligibility rules."
        }
    ];

    function showContent(index) {
        const items = document.querySelectorAll('.nav-item');
        items.forEach(el => el.classList.remove('active'));
        event.target.classList.add('active');

        const c = contents[index];
        document.getElementById('content-display').innerHTML = `
            <div class="chapter-tag">${c.tag}</div>
            <h1>${c.title}</h1>
            <div class="card">
                <p style="font-size: 15px; line-height: 1.6; color: var(--subtext);">${c.desc}</p>
            </div>
            <div class="card">
                <h3 style="color: #60a5fa; margin-top:0;">${c.subtitle}</h3>
                <p style="color: var(--subtext); line-height: 1.5; font-size: 14px;">${c.subdesc}</p>
                <div class="code-grid">
                    <div class="code-box bad">${c.bad}</div>
                    <div class="code-box good">${c.good}</div>
                </div>
            </div>
        `;
    }

    showContent(0);
</script>

</body>
</html>
