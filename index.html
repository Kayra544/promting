<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptLab - Interactive Masterclass</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: #1f2937;
            --text-color: #f3f4f6;
            --subtext: #9ca3af;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --border: #374151;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 30px;
        }
        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--subtext);
            margin-bottom: 8px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background-color: rgba(139, 92, 246, 0.15);
            color: var(--text-color);
        }
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .header-tag {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h3 {
            color: #60a5fa;
            margin-top: 0;
        }
        .code-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        .code-box {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
        }
        .code-box.bad { border-left: 4px solid #ef4444; }
        .code-box.good { border-left: 4px solid #10b981; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">⚡ PromptLab</div>
    <div class="nav-item active" onclick="switchTab(0)">01. Introduction</div>
    <div class="nav-item" onclick="switchTab(1)">02. How LLMs Work</div>
    <div class="nav-item" onclick="switchTab(2)">03. Chat & Feedback</div>
    <div class="nav-item" onclick="switchTab(3)">04. LLM Applications</div>
    <div class="nav-item" onclick="switchTab(4)">05. Context & RAG</div>
</div>

<div class="main-content">
    <div id="content-area">
        <!-- İçerikler JavaScript ile yüklenecek -->
    </div>
</div>

<script>
    const data = [
        {
            tag: "MODULE 01",
            title: "Introduction to Prompt Engineering",
            desc: "A language model produces a continuation of the information it receives. Prompt engineering is the practice of making that continuation useful, relevant, and reliable.",
            qTitle: "The Central Question & Core Concept",
            qDesc: "Give a model the opening words 'The most important discovery of the experiment was...' and many continuations are possible. Prompt engineering goes far beyond clever phrasing; in real applications it covers context retrieval, conversation state, output constraints, and validation.",
            badPrompt: "Vague prompt:\nExplain transformers.",
            goodPrompt: "Designed prompt:\nExplain the Transformer neural architecture to 1st-year Computer Science students.\n- Start with the core bottleneck.\n- Include a comparative table."
        },
        {
            tag: "MODULE 02",
            title: "How LLMs Work",
            desc: "Large Language Models operate by predicting the next token based on statistical patterns learned from massive text corpora.",
            qTitle: "Tokens and Attention Mechanism",
            qDesc: "Models do not see words the way humans do; they break text down into tokens. The transformer's self-attention mechanism allows the model to weigh the significance of each word relative to all other words in the input sequence.",
            badPrompt: "Vague prompt:\nHow do models work?",
            goodPrompt: "Designed prompt:\nDescribe how self-attention works in transformers using a simple analogy for a beginner developer."
        },
        {
            tag: "MODULE 03",
            title: "Chat & Feedback (RLHF)",
            desc: "Aligning language models to follow instructions safely and effectively using human feedback.",
            qTitle: "Reinforcement Learning from Human Feedback",
            qDesc: "Chat models are fine-tuned using human preferences. This ensures they refuse harmful requests, maintain polite tones, and follow multi-turn conversational structures accurately.",
            badPrompt: "Vague prompt:\nBe a helpful assistant.",
            goodPrompt: "Designed prompt:\nAct as a strict code reviewer. Evaluate the following JavaScript snippet for performance leaks and security flaws."
        },
        {
            tag: "MODULE 04",
            title: "LLM Applications",
            desc: "Deploying language models into production systems requires robust API orchestration and prompt templates.",
            qTitle: "System Prompts & Guardrails",
            qDesc: "Real-world applications rely on fixed system instructions that define the AI's persona, boundaries, and expected JSON output formats for downstream software processing.",
            badPrompt: "Vague prompt:\nExtract data from text.",
            goodPrompt: "Designed prompt:\nExtract customer names and order IDs from the text below. Output strictly in JSON format with keys 'name' and 'order_id'."
        },
        {
            tag: "MODULE 05",
            title: "Context & RAG",
            desc: "Overcoming model knowledge cutoffs and hallucinations by integrating external data sources.",
            qTitle: "Retrieval-Augmented Generation",
            qDesc: "RAG combines vector databases with LLMs. When a user asks a question, relevant documents are retrieved and injected directly into the prompt context as grounded reference material.",
            badPrompt: "Vague prompt:\nAnswer based on company policy.",
            goodPrompt: "Designed prompt:\nUsing ONLY the provided policy excerpt below, answer the user's refund inquiry. Do not assume outside facts."
        }
    ];

    function switchTab(index) {
        const items = document.querySelectorAll('.nav-item');
        items.forEach((item, i) => {
            if (i === index) item.classList.add('active');
            else item.classList.remove('active');
        });

        const d = data[index];
        document.getElementById('content-area').innerHTML = `
            <div class="header-tag">${d.tag}</div>
            <h1>${d.title}</h1>
            <div class="card">
                <p style="font-size: 16px; line-height: 1.6; color: var(--subtext);">${d.desc}</p>
            </div>
            <div class="card">
                <h3>${d.qTitle}</h3>
                <p style="color: var(--subtext);">${d.qDesc}</p>
                <div class="code-grid">
                    <div class="code-box bad">${d.badPrompt}</div>
                    <div class="code-box good">${d.goodPrompt}</div>
                </div>
            </div>
        `;
    }

    // İlk açılışta ilk sekmeyi yükle
    switchTab(0);
</script>

</body>
</html>
